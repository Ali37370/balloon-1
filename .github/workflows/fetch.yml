name: fetch-assets
on:
  push:
    branches: [singing-street]
    paths: ['jobs/**']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -U edge-tts gTTS
      - name: fetch and tts
        run: python jobs/run.py
      - name: commit
        run: |
          git config user.name "singing-street-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git commit -m "assets" || echo nothing
          git push
